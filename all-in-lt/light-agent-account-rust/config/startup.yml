# Bootstrap identity only. Runtime values are owned by Config Server.
host: ${LIGHT_AGENT_STARTUP_HOST:dev.lightapi.net}
serviceId: ${LIGHT_AGENT_SERVICE_ID:com.networknt.agent.account-1.0.0}
envTag: ${LIGHT_AGENT_ENVIRONMENT:dev}
acceptHeader: application/yaml
timeout: ${LIGHT_AGENT_STARTUP_TIMEOUT:3000}
connectTimeout: ${LIGHT_AGENT_STARTUP_CONNECT_TIMEOUT:3000}
configServerUri: ${LIGHT_CONFIG_SERVER_URI:https://config-server:8435}
authorization: ${LIGHT_PORTAL_AUTHORIZATION:}
bootstrapCaCertPath: ${LIGHT_AGENT_BOOTSTRAP_CA_CERT_PATH:/config/ca.pem}
externalConfigDir: ${LIGHT_AGENT_EXTERNAL_CONFIG_DIR:/app/config-cache}
