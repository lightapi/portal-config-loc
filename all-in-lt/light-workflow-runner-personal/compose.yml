# Durable runner settings; image selection remains in the base release configuration.
services:
  controller:
    ports:
      - "127.0.0.1:8438:8438"
    environment:
      CONTROLLER_RUNNER_ENABLED: "${CONTROLLER_RUNNER_ENABLED:-true}"
      CONTROLLER_RUNNER_ADMISSION_PATH: /run/runner-admission.json
      CONTROLLER_RUNNER_JWT_AUDIENCE: urn:lightapi:runner
    volumes:
      - ./light-workflow-runner-personal/.runtime/admission.json:/run/runner-admission.json:ro
