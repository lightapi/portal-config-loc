  light-knowledge:
    image: ${LIGHT_KNOWLEDGE_IMAGE:-networknt/light-knowledge:2.3.5-dev.20260807.2117}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /tmp
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export LIGHT_PORTAL_AUTHORIZATION="$$(cat /run/knowledge-runtime/knowledge-portal-authorization)"
        exec /usr/local/bin/light-knowledge
    ports: ["${LIGHT_KNOWLEDGE_PORT:-8092}:8092"]
    volumes:
      - ../light-knowledge/config:/tmp/config:ro,Z
      - light-knowledge-runtime:/run/knowledge-runtime:ro
      - ./light-controller-rust/ca.pem:/keystore/ca.pem:ro,Z
      - ../light-knowledge/objects:/var/lib/light-knowledge/objects:Z
    environment:
      LIGHT_KNOWLEDGE_CONFIG_FILE: /tmp/config/knowledge.yml
    depends_on:
      postgres: {condition: service_healthy}
      light-knowledge-bootstrap: {condition: service_healthy}
      llm-gateway: {condition: service_started}

  light-knowledge-bootstrap:
    image: ${LIGHT_KNOWLEDGE_IMAGE:-networknt/light-knowledge:2.3.5-dev.20260807.2117}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        umask 022
        runtime=/run/knowledge-runtime
        mkdir -p "$${runtime}"
        printf '%s' 'postgres://postgres:secret@postgres:5432/configserver' > "$${runtime}/knowledge-database-url"
        printf '%s' 'postgres://postgres:secret@postgres:5432/configserver' > "$${runtime}/knowledge-worker-database-url"
        printf '%s' 'postgres://postgres:secret@postgres:5432/configserver' > "$${runtime}/knowledge-projector-database-url"
        printf '%s' "$${LIGHT_AGENT_DELEGATION_SECRET}" > "$${runtime}/agent-delegation-secret"
        printf '%s' 'local-query-cache-key-0123456789abcdef0123456789abcdef' > "$${runtime}/knowledge-query-cache-key"
        printf '%s' 'local-heartbeat-key-0123456789abcdef0123456789abcdef' > "$${runtime}/knowledge-heartbeat-secret"
        token="$${LIGHT_KNOWLEDGE_AUTHORIZATION}"
        test -n "$${token}"
        printf '%s' "$${KNOWLEDGE_PORTAL_AUTHORIZATION:-$${token}}" > "$${runtime}/knowledge-portal-authorization"
        printf '%s' "$${KNOWLEDGE_INDEX_EMBEDDING_AUTHORIZATION:-$${token}}" > "$${runtime}/knowledge-index-embedding-authorization"
        printf '%s' "$${KNOWLEDGE_QUERY_EMBEDDING_AUTHORIZATION:-$${token}}" > "$${runtime}/knowledge-query-embedding-authorization"
        printf '%s\n' 'ready' > "$${runtime}/ready"
        chmod 0755 "$${runtime}"
