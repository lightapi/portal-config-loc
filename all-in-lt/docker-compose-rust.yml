      LIGHT_PORTAL_AUTHORIZATION: "${LLM_GATEWAY_LIGHT_PORTAL_AUTHORIZATION:-Bearer eyJhbGciOiJSUzI1NiIsImtpZCI6IkFacDAyTUN1Y3J1WmZGSmJ5eUZ3dWcifQ..ZXhlp0_pvMwDNS-Pws54jvCUFVwtXnyKwBD96V8FEWgWDf0RHovUtwhAYCvBM1OzpwCjIMhmzIQIsTQGcjl0iVK8khsX_VOXUVVVWHRX_u_XTkv05MOT0ywe1c-6ZIJHk-TOK9YCPt8CWE_QZVmbIyK44N8XIZIMhYybNBO_1ffKCyfzo2fJxr8fQwNIyhlHqKO4WF-WhSl4wdrkh879tSf1eELwxuIXPcXQqlbHrZT3WM85ICq1Z6nf6jt6Bp0qsxCEX2I-14PRFTYV7Q_1FBHh5YdWjDaKrvSfF_lsNfi1B-UWrH6nptkawaGhhM14enqDMzHM2kcRIti5nDvajQ}"
