      postgres: {condition: service_healthy}
      knowledge-schema-migration: {condition: service_completed_successfully}
      light-knowledge-admin: {condition: service_healthy}
      config-server: {condition: service_healthy}
      controller: {condition: service_healthy}
      llm-gateway: {condition: service_started}

  light-knowledge-worker:
    image: ${LIGHT_KNOWLEDGE_WORKER_IMAGE:-networknt/light-knowledge-worker:latest}
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /tmp
    volumes:
      - ./light-controller-rust/ca.pem:/keystore/ca.pem:ro,Z
      - ../light-knowledge/objects:/var/lib/light-knowledge/objects:Z
      - ../light-knowledge/checkouts:/var/lib/light-knowledge/checkouts:Z
    environment:
      LIGHT_KNOWLEDGE_WORKER_DATABASE_URL: postgres://light_knowledge_runtime:knowledge-local-secret@postgres:5432/knowledge
      LIGHT_KNOWLEDGE_EXPECTED_DATABASE: knowledge
      LIGHT_PORTAL_AUTHORIZATION: *knowledge_embedding_authorization
      # The checked-in local certificate is issued to localhost, not the
      # Compose DNS name. The CA chain is still verified; production keeps
      # hostname verification enabled and uses a matching service SAN.
      knowledgeWorker.embeddingGatewayVerifyHostname: "false"
    depends_on:
      postgres: {condition: service_healthy}
      knowledge-schema-migration: {condition: service_completed_successfully}
      light-knowledge-admin: {condition: service_healthy}
      llm-gateway: {condition: service_started}

  light-knowledge-admin:
    image: ${LIGHT_KNOWLEDGE_ADMIN_IMAGE:-networknt/light-knowledge-admin:latest}
    expose: ["8093"]
    environment:
      LIGHT_KNOWLEDGE_DATABASE_URL: postgres://light_knowledge_admin_runtime:knowledge-admin-local-secret@postgres:5432/knowledge
      LIGHT_KNOWLEDGE_ADMIN_OPAQUE_ACTOR_KEY: ${LIGHT_KNOWLEDGE_ADMIN_OPAQUE_ACTOR_KEY:-local-opaque-actor-key-0123456789abcdef}
