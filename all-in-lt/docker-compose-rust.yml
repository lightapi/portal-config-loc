      CLIENT_VERIFYHOSTNAME: "false"
      CLIENT_CACERTPATH: /keystore/ca.pem
      CLIENT_TOKENKEYSERVERURL: https://light-oauth:6881
      CLIENT_TOKENKEYURI: /oauth2/AZZRJE52eXu3t1hseacnGQ/keys
      SECURITY_AUDIENCE: "[urn:com.networknt]"
      SECURITY_ISSUER: urn:com:networknt:oauth2:v1
      knowledgeAdmin.ignoreJwtExpiry: "true"
      KNOWLEDGE_ADMIN_SNAPSHOT_SOURCE_ENABLED: "true"
      KNOWLEDGE_ADMIN_SNAPSHOT_QUERY_URL: https://hybrid-query:8440/portal/query
      KNOWLEDGE_ADMIN_SNAPSHOT_ENVIRONMENT: ${KNOWLEDGE_SNAPSHOT_ENVIRONMENT:-dev}
      KNOWLEDGE_ADMIN_SNAPSHOT_REFRESH_SECONDS: ${KNOWLEDGE_SNAPSHOT_REFRESH_SECONDS:-60}
      KNOWLEDGE_ADMIN_SNAPSHOT_VERIFY_HOSTNAME: "false"
      KNOWLEDGE_ADMIN_SNAPSHOT_CA_CERT_FILE: /keystore/ca.pem
