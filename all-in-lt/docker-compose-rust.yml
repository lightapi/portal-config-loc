        condition: service_healthy
      controller:
        condition: service_healthy
      config-server:
        condition: service_healthy
      light-oauth:
        condition: service_healthy

  light-agent:
    image: ${LIGHT_AGENT_IMAGE:-networknt/light-agent:2.3.5-dev.20260807.2117}
