    hostname: light-gateway
    container_name: light-gateway
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy

  llm-gateway:
    image: ${LIGHT_GATEWAY_IMAGE:-networknt/light-gateway:2.3.5-dev.20260807.2117}
    ports:
      - "${LLM_GATEWAY_HOST_PORT:-8444}:8443"
    volumes:
      - ./llm-gateway-rust/config:/config:ro,Z
      - llm-gateway-data:/app/data
