      CLIENT_CACERTPATH: /keystore/ca.pem
      LIGHT_KNOWLEDGE_DATABASE_URL: postgres://light_knowledge_runtime:knowledge-local-secret@postgres:5432/knowledge
      LIGHT_KNOWLEDGE_WORKER_DATABASE_URL: postgres://light_knowledge_runtime:knowledge-local-secret@postgres:5432/knowledge
      knowledgeWorker.jobExecutionMode: "external"
      LIGHT_AGENT_DELEGATION_SECRET: ${LIGHT_AGENT_DELEGATION_SECRET:-change-me-light-knowledge-local-secret}
