---
# Start the Rust-based local stack with:
#   docker compose up -d
#
# Service names stay stable so downstream configuration does not need to change.

x-light-agent-common: &light-agent-common
  image: ${LIGHT_AGENT_IMAGE:-networknt/light-agent:2.3.5-dev.20260807.2117}
  volumes:
    - ./light-agent-rust/config:/config:ro,Z
    - ./light-controller-rust/ca.pem:/keystore/ca.pem:ro,z
  depends_on:
    postgres:
      condition: service_healthy
    controller:
      condition: service_healthy
    config-server:
      condition: service_healthy
    hybrid-query:
      condition: service_started
    light-gateway:
      condition: service_started
    light-knowledge:
      condition: service_started
  healthcheck:
    test: ["CMD-SHELL", "curl -f http://localhost:8083/health || exit 1"]
    interval: 10s
    timeout: 5s
    retries: 10
    start_period: 10s

x-light-agent-environment: &light-agent-environment
  LIGHT_RS_CONFIG_DIR: /config
  DATABASE_URL: postgres://portal_loc_runtime:secret@postgres:5432/configserver
  RUST_LOG: "${LIGHT_AGENT_RUST_LOG:-info}"
  AGENT_LOG_ANSI: "false"
  LIGHT_AGENT_DELEGATION_SECRET: "${LIGHT_AGENT_DELEGATION_SECRET:-change-me-light-knowledge-local-secret}"
  LIGHT_AGENT_HOST_ID: "${LIGHT_AGENT_HOST_ID:-01964b05-552a-7c4b-9184-6857e7f3dc5f}"
  LIGHT_AGENT_ENVIRONMENT: "${LIGHT_AGENT_ENVIRONMENT:-dev}"
  LIGHT_ENV_TAG: "${LIGHT_AGENT_ENV_TAG:-dev}"

services:

  postgres:
    image: timescale/timescaledb:latest-pg17
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-db/init-environment.sh:/docker-entrypoint-initdb.d/00-init-environment.sh:ro,Z
      - ./postgres-db/lib:/docker-entrypoint-initdb.d/lib:ro,Z
      - ./postgres-db/init.sql:/docker-entrypoint-initdb.d/schema-source/configserver.sql:ro,Z
      - ./postgres-db/knowledge:/docker-entrypoint-initdb.d/schema-source/knowledge:ro,Z
      - ./postgres-db/zzz-local-knowledge-runtime.sql:/docker-entrypoint-initdb.d/schema-source/runtime-grants.sql:ro,Z
    environment:
      POSTGRES_PASSWORD: secret
      PORTAL_DB_TOPOLOGY: separate
      PORTAL_DB_NAME: configserver
      PORTAL_DB_KNOWLEDGE_NAME: knowledge
    command: postgres -c wal_level=logical -c max_replication_slots=10 -c max_wal_senders=10
    ports:
      - 5432:5432
    hostname: postgres
    container_name: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  knowledge-schema-migration:
    image: timescale/timescaledb:latest-pg17
    entrypoint: ["/bin/sh", "-ec", "/bin/bash /docker-entrypoint-initdb.d/validate-environment.sh && psql -v ON_ERROR_STOP=1 -U postgres -d postgres -v database_user=postgres -v configserver_database=configserver -v knowledge_database=knowledge -v configserver_schema=configserver -v knowledge_schema=knowledge -f /docker-entrypoint-initdb.d/zzz-local-knowledge-runtime.sql"]
    volumes:
      - ./postgres-db/validate-environment.sh:/docker-entrypoint-initdb.d/validate-environment.sh:ro,Z
      - ./postgres-db/knowledge:/docker-entrypoint-initdb.d/knowledge:ro,Z
      - ./postgres-db/zzz-local-knowledge-runtime.sql:/docker-entrypoint-initdb.d/zzz-local-knowledge-runtime.sql:ro,Z
    environment:
      PGHOST: postgres
      POSTGRES_USER: postgres
      PGPASSWORD: secret
      PORTAL_DB_TOPOLOGY: separate
      PORTAL_DB_NAME: configserver
      PORTAL_DB_KNOWLEDGE_NAME: knowledge
    depends_on:
      postgres: {condition: service_healthy}

  hybrid-command:
    image: ${PORTAL_HYBRID_COMMAND_IMAGE:-networknt/portal-hybrid-command:2.2.1}
    environment:
      NOREPLAY_EMAIL_PASSWORD: ${NOREPLAY_EMAIL_PASSWORD}
      LIGHT_KNOWLEDGE_ADMIN_COMMAND_URL: http://light-knowledge-admin:8093/v1/knowledge/admin/commands
      INSTANCE_CLONE_PLAN_HMAC_KEY: ${INSTANCE_CLONE_PLAN_HMAC_KEY:-light-portal-development-only-instance-clone-hmac-key-v1}
      INSTANCE_CLONE_PLAN_HMAC_KEY_ID: ${INSTANCE_CLONE_PLAN_HMAC_KEY_ID:-v1}
      WORKFLOW_TOOL_ACCESS_APPROVAL_WF_DEF_ID: 01a012f0-3ccb-792c-9aba-752269ec0b29
      WORKFLOW_TOOL_ACCESS_APPROVAL_VERSION: 1.0.0
      WORKFLOW_TOOL_ACCESS_APPROVAL_DIGEST: sha256:29167fa1e53a00187685c8d459016fefbf69567dd974fc3a90d0d619ca3a887a
      KNOWLEDGE_WORKLOAD_PRINCIPALS: ${KNOWLEDGE_WORKLOAD_PRINCIPALS:-019ff2f7-e56e-758a-a17b-45b057556326,light-knowledge-worker,light-knowledge}
    volumes:
      - ./hybrid-command/config:/config:Z
      - ./hybrid-command/service:/service:Z
      - ${PORTAL_DATA_DIR:-./data}:/data:z
    ports:
      - 8439:8439
    hostname: hybrid-command
    container_name: hybrid-command
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy

  hybrid-query:
    image: ${PORTAL_HYBRID_QUERY_IMAGE:-networknt/portal-hybrid-query:2.2.1}
    volumes:
      - ./hybrid-query/node1:/config:Z
      - ./hybrid-query/service:/service:Z
      - ${PORTAL_DATA_DIR:-./data}:/data:z
    ports:
      - 8440:8440
    environment:
      LIGHT_KNOWLEDGE_CONTROL_SNAPSHOT_SIGNING_KEY: ${LIGHT_KNOWLEDGE_CONTROL_SNAPSHOT_SIGNING_KEY:-local-control-snapshot-signing-key-0123456789abcdef}
      INSTANCE_CLONE_PLAN_HMAC_KEY: ${INSTANCE_CLONE_PLAN_HMAC_KEY:-light-portal-development-only-instance-clone-hmac-key-v1}
      INSTANCE_CLONE_PLAN_HMAC_KEY_ID: ${INSTANCE_CLONE_PLAN_HMAC_KEY_ID:-v1}
      embedding-task.enabled: ${EMBEDDING_TASK_ENABLED:-false}
      embedding-task.provider: ${EMBEDDING_TASK_PROVIDER:-disabled}
      embedding-task.endpoint: ${EMBEDDING_TASK_ENDPOINT:-https://generativelanguage.googleapis.com/v1beta/openai/embeddings}
      embedding-task.model: ${EMBEDDING_TASK_MODEL:-gemini-embedding-001}
      embedding-task.dimension: ${EMBEDDING_TASK_DIMENSION:-384}
      embedding-task.apiKey: ${GEMINI_API_KEY:-}
      JAVA_TOOL_OPTIONS: "-Djdk.internal.httpclient.disableHostnameVerification=true"
      LIGHT_WORKFLOW_RULE_TEST_URL: "http://light-workflow:8436/rule/test"
    hostname: hybrid-query
    container_name: hybrid-query
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy

  controller:
    image: ${CONTROLLER_RS_IMAGE:-networknt/controller-rs:latest}
    volumes:
      - ./light-controller-rust:/keystore:ro,z
    environment:
      CONTROLLER_ADDR: 0.0.0.0:8438
      CONTROLLER_HOST_ID: 01964b05-552a-7c4b-9184-6857e7f3dc5f
      CONTROLLER_USER_ID: 01964b05-5532-7c79-8cde-191dcbd421b8
      CONTROLLER_TLS_CERT_PATH: /keystore/server.pem
      CONTROLLER_TLS_KEY_PATH: /keystore/server.key
      CONTROLLER_TLS_TRUST_CERT_PATH: /keystore/server.pem
      DATABASE_URL: postgres://portal_loc_runtime:secret@postgres:5432/configserver
      DATABASE_MAXIMUM_POOL_SIZE: 3
      MICROSERVICE_JWKS_URL: https://light-oauth:6881/oauth2/AZZRJE52eXu3t1hseacnGQ/keys
      MICROSERVICE_JWKS_VERIFY_HOSTNAME: "false"
      MICROSERVICE_JWT_AUDIENCE: urn:com.networknt
      CONTROLLER_MCP_MUTATIONS_ENABLED: "true"
      RUST_LOG: "${RUST_LOG:-debug}"
      CONTROLLER_LOG_ANSI: "false"
    hostname: controller
    container_name: controller
    depends_on:
      postgres:
        condition: service_healthy
      light-oauth:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -k -f https://localhost:8438/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  light-oauth:
    image: ${LIGHT_OAUTH_IMAGE:-networknt/light-oauth:2.2.1}
    ports:
      - 6881:6881
      # - 5005:5005
    volumes:
      - ./light-oauth-rust/config:/config:Z
    environment:
      LIGHT_RS_CONFIG_DIR: /config
      # The following environment variable will enable the debug in the container.
      RUST_LOG: "${RUST_LOG:-debug}"
      OAUTH_LOG_ANSI: "false"
    # restart: on-failure
    hostname: light-oauth
    container_name: light-oauth
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "printf 'GET /oauth2/AZZRJE52eXu3t1hseacnGQ/keys HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' | timeout 5 openssl s_client -connect localhost:6881 -servername localhost -quiet 2>/dev/null | grep -q 'HTTP/1.1 200 OK'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  config-server:
    image: ${CONFIG_SERVER_IMAGE:-networknt/config-server:2.2.1}
    ports:
      - 8435:8435
    volumes:
      - ./config-server-rust/config:/config:Z
    environment:
      LIGHT_RS_CONFIG_DIR: /config
      # The following environment variable will enable the debug in the container.
      RUST_LOG: "${RUST_LOG:-debug}"
      CONFIG_LOG_ANSI: "false"
    # restart: on-failure
    hostname: config-server
    container_name: config-server
    depends_on:
      postgres:
        condition: service_healthy
      light-oauth:
        condition: service_healthy
      controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  portal-service:
    image: ${PORTAL_SERVICE_IMAGE:-networknt/portal-service:2.2.1}
    ports:
      - 2498:2498
    volumes:
      - ./portal-service-rust/config:/config:Z
      - ./light-controller-rust/ca.pem:/keystore/ca.pem:ro,z
      - ${PORTAL_DATA_DIR:-./data}:/data
    environment:
      LIGHT_RS_CONFIG_DIR: /config
      LIGHT_PORTAL_AUTHORIZATION: "Bearer eyJhbGciOiJSUzI1NiIsImtpZCI6IkFacDAyTUN1Y3J1WmZGSmJ5eUZ3dWcifQ..tDyGlHWaWHmHQ_UUnWeG9DSHFzohHwxYG5sN5BNy5u2gkcXNwDmbGVk8MHEO5OgzgrKeG-qmfNCdRDxqbmKH_bj7hjOdtP8nRFc09tejXfWPbMxBKc__2YtE7ps5gXvjCa2Ren-RZaFm8Bi5AKP8SlLrefA5Qq-clDPRKJjiwD313ZfxasAHeUYzIsGHi7VCJRdpqB7zYTTbIipG8rmntil2fp7jowhSgGWLzGR1oQjP7FFuHZlMQ_7o9deR4SIK3wVjKh_eOE0WDp6zwyNRzsnaU30R4zs6txw7JU6zv_JUsR3WWLKeWlKSMj1cRlt6NM48QA7136D_MLL_AzgtXw"
      # The following environment variable will enable the debug in the container.
      RUST_LOG: "${RUST_LOG:-debug}"
      PORTAL_LOG_ANSI: "false"
    restart: on-failure
    hostname: portal-service
    container_name: portal-service
    networks:
      default:
        aliases:
          - reference
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_healthy
      controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  light-workflow-config-cache-init:
    image: ${LIGHT_WORKFLOW_IMAGE:-networknt/light-workflow:2.3.5-dev.20260807.2117}
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 999:999 /app/config-cache && chmod 700 /app/config-cache"]
    volumes:
      - light-workflow-config-cache:/app/config-cache
    restart: "no"

  light-workflow:
    image: ${LIGHT_WORKFLOW_IMAGE:-networknt/light-workflow:2.3.5-dev.20260807.2117}
    ports:
      - 8436:8436
    env_file:
      - ./light-workflow-rust/config/light-workflow.env
    volumes:
      - ./light-gateway-rust/config/ca.pem:/config/ca.pem:ro,Z
      - ./light-workflow-rust/config/startup.yml:/app/config/startup.yml:ro,Z
      - light-workflow-config-cache:/app/config-cache
    environment:
      LIGHT_PORTAL_AUTHORIZATION: "${LIGHT_WORKFLOW_LIGHT_PORTAL_AUTHORIZATION:-Bearer eyJhbGciOiJSUzI1NiIsImtpZCI6IkFacDAyTUN1Y3J1WmZGSmJ5eUZ3dWcifQ..HklSKUh2NSjlf469kwmf0f0pi9ojSst8enegZ4ebAsfBRGyQD-VnOFWchWUSksej4ofpSQFFiE_YNVASVImQC487BX6uFstr74laaiTcvr87w4ze8UCjsYJYJaW3OjXtp9SeIkrZS6bbUzqjsAYYQ2CjgaCoZLgnrItZZx1xALwYKeWonMfbpq0iNs02KnZLpoT4DN4YMP1avnT4WzbB_2-FvFIryVL3ecGkt5xho7LOsyQSF5uwpR7V4AO_NmOHTVeOlhpt69lFlY16YeFtzoH87Y0g6fwYTfEsyZ283pIkP7qRXHDkg92KromkqGSmhY7_4Nhwv6mGWrtJ7XmAMg}"
      WORKFLOW_IGNORE_USER_JWT_EXPIRY: "true"
      server.enableRegistry: "true"
      server.startOnRegistryFailure: "false"
      portalRegistry.portalUrl: "https://controller:8438"
      server.advertisedAddress: "light-workflow"
      RUST_LOG: "${RUST_LOG:-light_workflow=debug,info}"
    hostname: light-workflow
    container_name: light-workflow
    depends_on:
      light-workflow-config-cache-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      light-oauth:
        condition: service_healthy
      hybrid-command:
        condition: service_started
      hybrid-query:
        condition: service_started
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8436/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  demo-customer-profile-api:
    image: ${DEMO_CUSTOMER_PROFILE_API_IMAGE:-networknt/demo-customer-profile-api:0.1.0}
    ports:
      - 8085:8085
    volumes:
      - ./demo-customer-profile-api-rust/config:/app/config:ro,Z
      - ./light-controller-rust/ca.pem:/keystore/ca.pem:ro,z
    environment:
      CUSTOMER_PROFILE_CONFIG_DIR: /app/config
      CUSTOMER_PROFILE_EXTERNAL_CONFIG_DIR: /app/config-cache
      LIGHT_PORTAL_AUTHORIZATION: "${DEMO_CUSTOMER_PROFILE_API_LIGHT_PORTAL_AUTHORIZATION:-Bearer eyJhbGciOiJSUzI1NiIsImtpZCI6IkFacDAyTUN1Y3J1WmZGSmJ5eUZ3dWcifQ..oLyWqWjuHhC3UBdUOdchTByxvXo0gUoYsfq5G3E-Us3zkd8vOTxU195GJ-C2BK9meYuc5dsTTiJIwl-GjY_NDIocncPQG5wAy3YEnDP5z9cDvbfQQqSpQS5O7vgftAWe56Nl5CY9_BK4turOrnX8Li3KqDofm3HXFvsePrI4hHXLbEMnaSid10TqahH_NIoyQnjpvKgAWgnz5KwhZ-FvdqGkD3J3MsyyovVMz58btpwRbvhwrYpmT5rX2Su036lXwt68LIwkGTd_EaSYC-FaoCNHYzNt3rSuNngDSCtUU8SiIBC_Nxj6ZgFYlctTc3J0kVBcPVEcvQ8Lyl_PzrjfPA}"
      RUST_LOG: "${RUST_LOG:-debug}"
      CUSTOMER_PROFILE_LOG_ANSI: "false"
    hostname: demo-customer-profile-api
    container_name: demo-customer-profile-api
    depends_on:
      controller:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8085/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  demo-offer-decision-api:
    image: ${DEMO_OFFER_DECISION_API_IMAGE:-networknt/demo-offer-decision-api:0.1.0}
    ports:
      - 8086:8086
    volumes:
      - ./demo-offer-decision-api-rust/config:/app/config:ro,Z
      - ./light-controller-rust/ca.pem:/keystore/ca.pem:ro,z
    environment:
      OFFER_DECISION_CONFIG_DIR: /app/config
      OFFER_DECISION_EXTERNAL_CONFIG_DIR: /app/config-cache
      LIGHT_PORTAL_AUTHORIZATION: "${DEMO_OFFER_DECISION_API_LIGHT_PORTAL_AUTHORIZATION:-Bearer eyJhbGciOiJSUzI1NiIsImtpZCI6IkFacDAyTUN1Y3J1WmZGSmJ5eUZ3dWcifQ..lGVc5FRkisW4la8IT531zTVIboBVyaRXZ1SEQ2NH-z8Qh90G94otKXrKwAIFMK_4rWKqRxr-iCD04M6HtH-mM6v45b99EUS__MNQqkJ1mCzdikmoijg9lgtBvSxRaJzYWCJm0aRFm2Nv-ObOcTOnWzYbFpsTH90q-QkuS8PATIMAEgJ3fA_zMUWpJIzE7Zm24hDnOYk_5xqrWFV7TFDYtqv-8IxQ2NIWTvwIs4Kxnq7vssUb1P6qQ6ygxSjNUQ_QW5pvyVm1D5udNEAmulUFzk6o9T4lPowYJt_H_nOKnneVsiqr12TPj4CpWHaM86bZnIhrn6cXqUQGSzpw0V19Iw}"
      RUST_LOG: "${RUST_LOG:-debug}"
      OFFER_DECISION_LOG_ANSI: "false"
    hostname: demo-offer-decision-api
    container_name: demo-offer-decision-api
    depends_on:
      controller:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8086/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  demo-insurance-claim-mcp-server:
    image: ${DEMO_INSURANCE_CLAIM_MCP_SERVER_IMAGE:-networknt/demo-insurance-claim-mcp-server:latest}
    ports:
      - 8087:8087
    volumes:
      - ./demo-insurance-claim-mcp-server-rust/config:/app/config:ro,Z
      - ./light-controller-rust/ca.pem:/keystore/ca.pem:ro,z
    environment:
      INSURANCE_CLAIM_MCP_CONFIG_DIR: /app/config
      INSURANCE_CLAIM_MCP_EXTERNAL_CONFIG_DIR: /app/config-cache
      LIGHT_PORTAL_AUTHORIZATION: "${DEMO_INSURANCE_CLAIM_MCP_LIGHT_PORTAL_AUTHORIZATION:-Bearer eyJhbGciOiJSUzI1NiIsImtpZCI6IkFacDAyTUN1Y3J1WmZGSmJ5eUZ3dWcifQ..U2QrwSdmBe4seetd5e3LE9J1NiesOACkYAS-Qa4bqJDhvbS1WkaM4Na3yGL0mkdghGQlwWW2jK26HZKk3TmjVdeyGFpM6eAWKfOCIkqYxYoimRfb4TkHyZdz4DihhGmy6_PZpPuAUBrWbsHmQOeliXeh6VhMG3jQT5VG0jNykFA2hYFHl3yHiWKJmuIY5lKqdr0b3oMY42g9NvcDA1Y889EDF1f8r6kocdE0c4c_GWMIbnFzTBEf5JmjJ4pKswCrS9CmIMEOyL8pTrdOy3R2zn_TX_R-Hw2xoeSwpt6Q9_Vy_SE1qNvm2ZKAX1prn-PcYm4Q5oEfCjBqpbPvwObNeA}"
      RUST_LOG: "${RUST_LOG:-debug}"
      INSURANCE_CLAIM_MCP_LOG_ANSI: "false"
    hostname: demo-insurance-claim-mcp-server
    container_name: demo-insurance-claim-mcp-server
    depends_on:
      controller:
        condition: service_healthy
      config-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8087/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  light-gateway:
    image: ${LIGHT_GATEWAY_IMAGE:-networknt/light-gateway:2.3.5-dev.20260807.2117}
    ports:
      - "${LIGHT_GATEWAY_HOST_PORT:-443}:8443"
    volumes:
      - ./light-gateway-rust/config:/config:Z
      - ./light-gateway-rust/lightapi/dist:/lightapi/dist:Z
      - ./light-gateway-rust/signin/dist:/signin/dist:Z
    environment:
      LIGHT_RS_CONFIG_DIR: /config
      # ACCESS_CONTROL_ENABLED: "false"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      CLIENT_VERIFYHOSTNAME: "false"
      CLIENT_CACERTPATH: /config/ca.pem
      STATELESSAUTH_BOOTSTRAPTOKEN: ${STATELESSAUTH_BOOTSTRAPTOKEN}
      STATELESSAUTH_GITHUBCLIENTSECRET: ${STATELESSAUTH_GITHUBCLIENTSECRET}
      STATELESSAUTH_GOOGLECLIENTSECRET: ${STATELESSAUTH_GOOGLECLIENTSECRET}
