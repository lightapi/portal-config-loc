version: 1
databaseUrlFile: /run/knowledge-runtime/knowledge-database-url
delegationSecretFile: /run/knowledge-runtime/agent-delegation-secret
queryCacheKeyFile: /run/knowledge-runtime/knowledge-query-cache-key
heartbeatSecretFile: /run/knowledge-runtime/knowledge-heartbeat-secret
delegationIssuer: light-agent
objectStoreRoot: /var/lib/light-knowledge/objects
maximumRequestBytes: 1048576
maximumQueryBytes: 8192
requestTimeoutMs: 1000
maximumDatabaseConnections: 20
projectionLeaseSeconds: 30
deterministicPilot: false
embeddingGatewayUrl: https://llm-gateway:8443/
embeddingAuthorizationFile: /run/knowledge-runtime/knowledge-query-embedding-authorization
embeddingAlias: kb-query
embeddingSpaceId: nvidia-nemotron-3-embed-1b-float-v1
embeddingSpaceRevision: 1
embeddingDimension: 2048
queryCacheMaximumEntries: 2048
queryCacheMaximumBytes: 67108864
queryCacheTtlSeconds: 300
graphLimits:
  maximumSeeds: 8
  maximumPairs: 64
  maximumFanOut: 16
  maximumHops: 3
  maximumVisitedNodes: 128
  maximumVisitedEdges: 256
  maximumPaths: 32
  maximumEvidenceChunks: 20
  maximumTokenBudget: 4096
  maximumMemoryBytes: 1048576
  timeoutMs: 100
features:
  deltaSegments: true
  uploads: true
  contextExpansion: false
  multiKnowledgeBase: true
  graphAssisted: false
  enterpriseSourceAcls: false
  embeddingMigration: false
  productionOperations: false
