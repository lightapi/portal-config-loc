version: 1
projectionMode: embedded
jobExecutionMode: embedded
workerDatabaseUrlFile: /run/secrets/knowledge-worker-database-url
projectorDatabaseUrlFile: /run/secrets/knowledge-projector-database-url
controlPlaneEventDatabaseUrlFile: /run/secrets/configserver-event-read-url
expectedKnowledgeDatabase: knowledge
expectedControlPlaneDatabase: configserver
heartbeatSecretFile: /run/secrets/knowledge-heartbeat-secret
portalCommandUrl: https://hybrid-command:8439/portal/command
portalAuthorizationFile: /run/secrets/knowledge-portal-authorization
portalCommandCaCertFile: /keystore/ca.pem
portalCommandVerifyHostname: false
checkoutRoot: /var/lib/light-knowledge/checkouts
objectStoreRoot: /var/lib/light-knowledge/objects
projectorId: light-knowledge-runtime-loc
deterministicPilot: false
migrationDeterministicPilot: false
embeddingGatewayUrl: https://llm-gateway:8443/v1/embeddings
embeddingAuthorizationFile: /run/secrets/knowledge-index-embedding-authorization
embeddingGatewayCaCertFile: /keystore/ca.pem
embeddingGatewayVerifyHostname: false
embeddingAlias: kb-index
embeddingBatchSize: 1
embeddingMigrationEnabled: false
productionOperationsEnabled: false
graphAssistedEnabled: false
platformCaps:
  maximumDocuments: ${knowledgeWorker.platformCaps.maximumDocuments:10000}
  maximumChunks: ${knowledgeWorker.platformCaps.maximumChunks:100000}
  maximumSourceBytes: ${knowledgeWorker.platformCaps.maximumSourceBytes:268435456}
  maximumStoredBytes: ${knowledgeWorker.platformCaps.maximumStoredBytes:1073741824}
  maximumEmbeddingTokens: ${knowledgeWorker.platformCaps.maximumEmbeddingTokens:20000000}
  maximumSpendMicros: ${knowledgeWorker.platformCaps.maximumSpendMicros:10000000}
  maximumWallTimeSeconds: ${knowledgeWorker.platformCaps.maximumWallTimeSeconds:900}
  maximumConcurrency: ${knowledgeWorker.platformCaps.maximumConcurrency:8}
  maximumProviderCalls: ${knowledgeWorker.platformCaps.maximumProviderCalls:1024}
